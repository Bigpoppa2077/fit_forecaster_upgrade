* { box-sizing: border-box; }
html { background: var(--page); }
body { margin: 0; background: var(--page); font-family: var(--font); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--hi); outline-offset: 2px; }

.wrap { display: flex; justify-content: center; padding-block: 16px; padding-inline: 16px; min-height: 100%; }
.app { width: 100%; max-width: 430px; background: var(--frame); border-radius: 30px; padding: 10px; position: relative; color: var(--text); }
.board { background-color: var(--board); background-image: var(--texture); border: 2px solid var(--frame-edge); border-radius: 22px;
  padding: 18px 22px 26px; min-height: 760px; position: relative; overflow: hidden; }
@media (max-width: 480px) {
  .wrap { padding-inline: 0; padding-block: 0; }
  .app { max-width: none; border-radius: 0; min-height: 100vh; }
  .board { border-radius: 14px; min-height: calc(100vh - 20px); padding-inline: 18px; }
}

.top { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 36px; }
.small { font-size: 14px; font-weight: 500; color: var(--muted); }
.switch { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; color: var(--muted); padding: 6px 8px; border-radius: 999px; }
.switch svg { width: 16px; height: 16px; }
h1 { font-size: 31px; font-weight: 800; letter-spacing: -.02em; line-height: 1.1; margin: 6px 0 4px; text-wrap: balance; }
.sub { font-size: 16px; color: var(--muted); margin: 0; }
.heading { font-size: 15px; font-weight: 600; color: var(--label); margin: 22px 0 9px; }

.hand { border-radius: 255px 15px 225px 15px / 15px 225px 15px 255px; }
.chips { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.chip { height: 48px; font-size: 15.5px; font-weight: 600; border: 2px solid var(--line); color: var(--text); }
.chip[aria-pressed="true"] { border: 3px solid var(--hi); color: var(--hi); }
.chip.wide { grid-column: 1 / -1; }

.wheel { position: relative; height: 230px; display: flex; justify-content: center; align-items: center; gap: 4px; }
.wheel .band { position: absolute; left: 0; right: 0; top: 50%; height: 46px; transform: translateY(-50%);
  border-top: 2px dashed var(--line); border-bottom: 2px dashed var(--line); pointer-events: none; }
.col { width: 92px; height: 100%; overflow-y: scroll; scroll-snap-type: y mandatory; scrollbar-width: none; outline: none;
  -webkit-mask-image: linear-gradient(transparent, #000 30%, #000 70%, transparent); mask-image: linear-gradient(transparent, #000 30%, #000 70%, transparent); }
.col::-webkit-scrollbar { display: none; }
.pad { height: 92px; }
.item { height: 46px; line-height: 46px; text-align: center; font-size: 30px; font-weight: 600; scroll-snap-align: center;
  font-variant-numeric: tabular-nums; color: var(--muted); cursor: pointer; user-select: none; }
.item.on { color: var(--text); }
.colon { font-size: 30px; font-weight: 600; }
.foot { font-size: 14px; color: var(--muted); margin: 6px 4px 20px; }

.btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 56px; font-size: 18px; font-weight: 700;
  background: var(--btn); color: var(--btn-ink); transition: transform .09s ease; }
.btn:active { transform: scale(.97); }
.btn.outline { height: 50px; font-size: 16px; font-weight: 600; background: transparent; color: var(--text); border: 2px solid var(--line); margin-top: 10px; }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pair.one { grid-template-columns: 1fr; }
.btn svg { width: 20px; height: 20px; }

.back { display: inline-flex; align-items: center; gap: 6px; font-size: 16px; padding: 6px 0; min-width: 0; }
.back b { font-weight: 700; } .back span { color: var(--muted); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.back svg { width: 20px; height: 20px; flex: none; }
.days { display: flex; gap: 18px; overflow-x: auto; scrollbar-width: none; padding-top: 6px; }
.days::-webkit-scrollbar { display: none; }
.day { font-size: 15px; font-weight: 500; color: var(--muted); padding-bottom: 5px; border-bottom: 3px solid transparent; white-space: nowrap; }
.day[aria-pressed="true"] { color: var(--text); font-weight: 700; border-bottom-color: var(--hi); }

.hero { display: flex; align-items: center; gap: 6px; margin-top: 22px; }
.circled { position: relative; display: inline-block; flex: none; }
.circled svg { position: absolute; inset: -4px -8px -4px -6px; width: calc(100% + 14px); height: calc(100% + 8px); overflow: visible; }
.big { position: relative; font-size: 62px; font-weight: 800; letter-spacing: -.02em; line-height: 1; padding: 12px 24px 10px; font-variant-numeric: tabular-nums; }
.note { font-size: 17px; font-weight: 700; color: var(--hi); line-height: 1.15; text-align: center; width: 90px; }
.why { font-size: 16px; font-weight: 500; margin: 22px 0 8px; }
.why em { font-style: normal; color: var(--hi); font-weight: 700; }
.rows { display: grid; gap: 2px; }
.row { display: grid; grid-template-columns: 66px 28px 1fr auto; align-items: center; gap: 0 12px; padding: 4px 0;
  font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; }
.row .n { text-align: right; }
.row.pick .t, .row.pick .n { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 2px; }
.row.best { color: var(--hi); }
.row .tag { font-size: 14px; font-weight: 500; color: var(--muted); display: inline-flex; align-items: center; gap: 2px; }
.row.best .tag { color: var(--hi); font-weight: 700; }
.row .tag svg { width: 16px; height: 16px; }
.links { display: flex; justify-content: center; flex-wrap: wrap; gap: 6px 16px; margin-top: 18px; }
.link { font-size: 14px; font-weight: 500; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; padding: 4px 2px; }
.daychart { margin-top: 14px; }
.daychart svg { display: block; width: 100%; height: auto; }
.demo { font-size: 12.5px; color: var(--muted); text-align: center; margin-top: 18px; }
.demo a { color: var(--text); font-weight: 600; }

/* bottom sheets */
.scrim { position: absolute; inset: 0; background: rgba(0,0,0,.35); border-radius: 30px; display: flex; align-items: flex-end; z-index: 10; }
.scrim[hidden] { display: none; }
.sheet { width: 100%; background-color: var(--board); background-image: var(--texture); border-radius: 22px 22px 18px 18px; padding: 10px 22px 24px;
  box-shadow: 0 -8px 24px var(--sheet-shadow); max-height: 85%; overflow-y: auto; }
.grab { width: 40px; height: 4px; border-radius: 2px; background: var(--muted); margin: 4px auto 12px; }
.sheet h2 { font-size: 26px; font-weight: 800; letter-spacing: -.02em; margin: 0 0 4px; }
.sheet p { font-size: 15px; color: var(--muted); margin: 0; line-height: 1.45; }
.reason { margin-bottom: 10px; } .reason b { display: block; font-size: 16px; font-weight: 600; } .reason span { font-size: 14px; color: var(--muted); }
.field { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 12px; font-size: 15px; color: var(--muted); }
.field select { font: inherit; font-size: 19px; font-weight: 600; color: var(--text); background: transparent; border: 2px solid var(--line); border-radius: 10px; padding: 4px 8px; font-variant-numeric: tabular-nums; }
.stepper { display: flex; align-items: center; gap: 4px; }
.stepper button { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--line); font-size: 22px; line-height: 1; color: var(--text); }
.stepper output { width: 48px; text-align: center; font-size: 24px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
.tallyline { display: flex; justify-content: flex-end; margin: 6px 0 16px; min-height: 24px; }

.toast { position: absolute; left: 16px; right: 16px; bottom: 18px; background: var(--text); color: var(--board); font-size: 15px; font-weight: 500;
  padding: 12px 14px; border-radius: 14px; z-index: 20; }
.toast[hidden] { display: none; }
@media (prefers-reduced-motion: no-preference) { .toast { animation: rise .2s ease-out; } @keyframes rise { from { transform: translateY(8px); opacity: 0; } } }
</style>
</head>
<body>


<div class="wrap">
  <div class="app" id="app">
    <div class="board" id="board" aria-live="polite"></div>
    <div class="scrim" id="scrim" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
    <div class="toast" id="toast" role="status" hidden></div>
  </div>
</div>

<script>
// ---------------------------------------------------------------- data

const FIRST = 12, LAST = 44, SEARCH = 3, SAME_ENOUGH = 0.5;
const WEEKDAYS = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
const SHORT = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];

const slotToTime = s => String(Math.floor(s / 2)).padStart(2, "0") + ":" + (s % 2 ? "30" : "00");
const weekdayName = d => WEEKDAYS[(d.getDay() + 6) % 7];
const today = (() => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); })();
const days = Array.from({ length: 7 }, (_, i) => new Date(today.getFullYear(), today.getMonth(), today.getDate() + i));
const dayLabel = (d, i) => i === 0 ? "Today" : i === 1 ? "Tomorrow" : `${SHORT[(d.getDay() + 6) % 7]} ${d.getDate()}`;
const dayWord = (d, i) => i === 0 ? "today" : i === 1 ? "tomorrow" : `on ${weekdayName(d)}`;
const peopleText = n => `${Math.round(n)} ${Math.round(n) === 1 ? "person" : "people"}`;

function forecast(split, dayIndex) {
  const wanted = weekdayName(days[dayIndex]);
  const d = DEMO.days.find(x => x.weekday === wanted) || DEMO.days[0];
  return d.forecasts[split];
}
function defaultSlot() {
  const n = new Date();
  const s = n.getHours() * 2 + (n.getMinutes() >= 30 ? 1 : 0) + 1;
  return s >= FIRST && s <= LAST ? s : 36;
}

// ---------------------------------------------------------------- the rule (same as the Flutter app and Python app)
const crowdLevel = (v, peak) => { const r = peak > 0 ? v / peak : 0; return r < .4 ? "Quiet" : r < .75 ? "Moderate" : "Busy"; };
const round1 = x => Math.round(x * 10) / 10;

function recommend(slots, prefSlot, word, weekday, split) {
  const by = new Map(slots.map(s => [s.slot, s]));
  const pref = by.get(prefSlot) || slots[0];
  let peakS = slots[0];
  for (const s of slots) if (s.people > peakS.people) peakS = s;
  const peak = peakS.people;
  const nearby = [];
  for (let s = pref.slot - SEARCH; s <= pref.slot + SEARCH; s++) if (by.has(s)) nearby.push(by.get(s));
  let best = nearby.reduce((a, b) => {
    const ka = round1(a.people), kb = round1(b.people);
    if (ka !== kb) return ka < kb ? a : b;
    return Math.abs(a.slot - pref.slot) <= Math.abs(b.slot - pref.slot) ? a : b;
  });
  if (pref.people - best.people < SAME_ENOUGH) best = pref;
  const level = crowdLevel(best.people, peak);
  const reasons = [];
  if (best.slot === pref.slot) {
    reasons.push(["Nothing nearby is quieter", `Within 90 minutes of ${slotToTime(pref.slot)}, no time saves you even half a person.`]);
  } else {
    const saved = Math.round(pref.people - best.people);
    reasons.push([`${saved} fewer ${saved === 1 ? "person" : "people"} than ${slotToTime(pref.slot)}`, `About ${peopleText(best.people)} instead of ${peopleText(pref.people)}.`]);
    const mins = Math.abs(best.slot - pref.slot) * 30;
    const gap = mins < 60 ? `${mins} min` : `${Math.floor(mins / 60)} h${mins % 60 ? " " + (mins % 60) + " min" : ""}`;
    reasons.push([`${gap} ${best.slot > pref.slot ? "later" : "earlier"} than you picked`, `The quietest time within 90 minutes of ${slotToTime(pref.slot)}.`]);
  }
  reasons.push([`${level} for ${split.toLowerCase()} ${word}`, `The busiest time is ${slotToTime(peakS.slot)}, with about ${peopleText(peak)}.`]);
  if (best.past_weeks > 0 && best.past_avg != null) {
    reasons.push([`Past ${weekday}s at ${slotToTime(best.slot)}`, `About ${best.past_avg.toFixed(1)} people on average over ${best.past_weeks} weeks.`]);
  }
  return { pref, best, peak, peakSlot: peakS.slot, nearby, level, kept: best.slot === pref.slot, reasons };
}

function boardRows(rec) {
  let from = Math.min(rec.pref.slot, rec.best.slot), to = Math.max(rec.pref.slot, rec.best.slot);
  const have = new Set(rec.nearby.map(s => s.slot));
  while (to - from + 1 < 4) {
    if (have.has(to + 1)) to++; else if (have.has(from - 1)) from--; else break;
  }
  return rec.nearby.filter(s => s.slot >= from && s.slot <= to);
}
function boardNote(rec) {
  const p = peopleText(rec.best.people);
  return rec.level === "Quiet" ? `only ${p}!` : rec.level === "Moderate" ? `about ${p}` : `busy: ${p}`;
}
function boardWhy(rec) {
  if (rec.kept) return ["Nothing within 90 minutes is ", "quieter", " than your time."];
  const saved = Math.round(rec.pref.people - rec.best.people);
  const mins = Math.abs(rec.best.slot - rec.pref.slot) * 30;
  const gap = mins < 60 ? `${mins} min` : `${Math.floor(mins / 60)} h${mins % 60 ? " " + (mins % 60) : ""}`;
  return [`${saved} fewer than ${slotToTime(rec.pref.slot)}, just `, `${gap} ${rec.best.slot > rec.pref.slot ? "later" : "earlier"}`, "."];
}

function tally(n, color, max = 15) {
  const shown = Math.min(n, max); let x = 4, out = "";
  for (let g = 0; g < shown; g += 5) {
    const k = Math.min(5, shown - g);
    for (let i = 0; i < Math.min(k, 4); i++) out += `<path d="M${x + i * 7 + 1} 3 L${x + i * 7} 21"/>`;
    if (k === 5) out += `<path d="M${x - 3} 17 L${x + 26} 7"/>`;
    x += 38;
  }
  const plus = n > max ? `<text x="${x - 6}" y="19" font-size="16" font-weight="700" fill="${color}" stroke="none">+</text>` : "";
  return `<svg width="${x + (n > max ? 12 : 0)}" height="24" stroke="${color}" stroke-width="2.4" stroke-linecap="round" role="img" aria-label="${n} people">${out}${plus}</svg>`;
}
const crowdColor = l => l === "Quiet" ? "var(--quiet)" : l === "Moderate" ? "var(--moderate)" : "var(--busy)";

function dayChart(slots, rec) {
  const W = 340, H = 150, lab = 22, chartH = H - lab, sw = W / slots.length, peak = rec.peak || 1;
  const near = new Set(rec.nearby.map(s => s.slot));
  let out = "";
  slots.forEach((s, i) => {
    const h = s.people / peak * (chartH - 6), x = i * sw + sw / 2;
    if (h > 1) out += `<line x1="${x}" y1="${chartH}" x2="${x + 1.5}" y2="${chartH - h}" stroke="${crowdColor(crowdLevel(s.people, rec.peak))}" stroke-width="${sw * .55}" stroke-linecap="round" opacity="${near.has(s.slot) ? 1 : .35}"/>`;
  });
  for (let i = 0; i < slots.length; i += 8)
    out += `<text x="${Math.min(Math.max(i * sw + sw / 2, 14), W - 14)}" y="${H - 4}" text-anchor="middle" font-size="11" font-weight="500" fill="var(--muted)">${slotToTime(slots[i].slot)}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Crowd for the whole day. Busiest at ${slotToTime(rec.peakSlot)}.">${out}</svg>`;
}

  const d = days[state.dayIndex];
  const rec = recommend(slots, state.slot, dayWord(d, state.dayIndex), weekdayName(d), state.split);
  state.rec = rec;
  const [a, b, c] = boardWhy(rec);
  const rows = boardRows(rec).map(s => {
    const isBest = s.slot === rec.best.slot, isPick = s.slot === rec.pref.slot && !rec.kept;
    const tag = isBest ? `${ICON.back}${rec.kept ? "your pick" : "go"}` : isPick ? "your pick" : "";
    return `<div class="row${isBest ? " best" : isPick ? " pick" : ""}"><span class="t">${slotToTime(s.slot)}</span><span class="n">${Math.round(s.people)}</span>
      <span>${tally(Math.round(s.people), crowdColor(crowdLevel(s.people, rec.peak)))}</span><span class="tag">${tag}</span></div>`;
  }).join("");
  board.innerHTML = `
    <div class="top"><button class="back" id="back">${ICON.back}<b>${esc(state.split)}</b><span>· you picked ${slotToTime(state.slot)}</span></button>${themeSwitch()}</div>
    <div class="days" role="group" aria-label="Day">${days.map((dd, i) => `<button class="day" data-day="${i}" aria-pressed="${i === state.dayIndex}">${dayLabel(dd, i)}</button>`).join("")}</div>
    <div class="hero"><div class="circled">${ring()}<div class="big">${slotToTime(rec.best.slot)}</div></div><div class="note">${boardNote(rec)}</div></div>
    <div class="why">${a}<em>${b}</em>${c}</div>
    <div class="rows">${rows}</div>
    <div style="height:22px"></div>
    <button class="btn hand" id="going">I'm going at ${slotToTime(rec.best.slot)}</button>
    <div class="pair${rec.kept ? " one" : ""}">
      ${rec.kept ? "" : `<button class="btn outline hand" id="keep">Keep ${slotToTime(rec.pref.slot)}</button>`}
      <button class="btn outline hand" id="another">Pick another time</button>
    </div>
    <div class="links"><button class="link" id="wholeDay">${state.showDay ? "Hide the day" : "Whole day"}</button><button class="link" id="logBtn">Log the crowd</button><button class="link" id="howBtn">How it works</button></div>
    ${state.showDay ? `<div class="daychart">${dayChart(slots, rec)}</div>` : ""}
    <div class="demo">Demo: a saved week of forecasts from the trained models. Nothing is saved. <a href="../">About this project</a></div>`;
}

function render() { applyTheme(); state.step === 1 ? renderStep1() : renderStep2(); }

// ---------------------------------------------------------------- the time wheel
const ROW = 46;
const HOURS = []; for (let h = FIRST / 2; h <= LAST / 2; h++) HOURS.push(h);
// hours/mins: the two scroll columns; start: the slot to show; onPick: called with the chosen slot
function buildWheel(hours = document.getElementById("hours"), mins = document.getElementById("mins"), start = state.slot, onPick = s => { state.slot = s; }) {
  hours.innerHTML = `<div class="pad"></div>${HOURS.map((h, i) => `<div class="item" data-i="${i}">${String(h).padStart(2, "0")}</div>`).join("")}<div class="pad"></div>`;
  mins.innerHTML = `<div class="pad"></div><div class="item" data-i="0">00</div><div class="item" data-i="1">30</div><div class="pad"></div>`;
  hours.scrollTop = HOURS.indexOf(Math.floor(start / 2)) * ROW;
  mins.scrollTop = (start % 2) * ROW;
  const idx = col => Math.round(col.scrollTop / ROW);
  const paint = () => [hours, mins].forEach(col => col.querySelectorAll(".item").forEach(it => it.classList.toggle("on", +it.dataset.i === idx(col))));
  const settle = () => {
    let slot = HOURS[Math.min(idx(hours), HOURS.length - 1)] * 2 + Math.min(idx(mins), 1);
    if (slot > LAST) { slot = LAST; mins.scrollTo({ top: 0, behavior: "smooth" }); } // 22:30 is after closing
    onPick(slot);
  };
  [hours, mins].forEach(col => {
    let t;
    col.addEventListener("scroll", () => { paint(); clearTimeout(t); t = setTimeout(settle, 120); }, { passive: true });
    col.addEventListener("click", e => { const it = e.target.closest(".item"); if (it) col.scrollTo({ top: +it.dataset.i * ROW, behavior: "smooth" }); });
    col.addEventListener("keydown", e => {
      if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); col.scrollTo({ top: (idx(col) + (e.key === "ArrowDown" ? 1 : -1)) * ROW, behavior: "smooth" }); }
    });
  });
  paint();
}

// ---------------------------------------------------------------- sheets + toast
const scrim = document.getElementById("scrim"), sheet = document.getElementById("sheet");
function openSheet(html) { sheet.innerHTML = `<div class="grab"></div>${html}`; scrim.hidden = false; sheet.querySelector("button, select")?.focus(); }
function closeSheet() { scrim.hidden = true; sheet.innerHTML = ""; }
scrim.addEventListener("click", e => { if (e.target === scrim) closeSheet(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !scrim.hidden) closeSheet(); });

let toastTimer;
function toast(msg) { const t = document.getElementById("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, 3200); }

function howSheet() {
  const rec = state.rec;
  openSheet(`<h2>How it works</h2>
    <p>For each body group, three models (XGBoost, Random Forest and Linear Regression) predict the crowd for every half hour. The app looks 90 minutes either side of your time and picks the quietest, unless it saves less than half a person.</p>
    <div class="heading">Why this time</div>
    ${rec.reasons.map(([t, d]) => `<div class="reason"><b>${t}</b><span>${d}</span></div>`).join("")}
    <div class="heading">Reading the board</div>
    <p>Each mark is one person. Green = quiet, yellow = moderate, red = busy, compared with the busiest half hour of that day.</p>
    <div style="height:16px"></div><button class="btn hand" data-close>Got it</button>`);
}
// "Pick another time": choose a new time on the wheel, then check the quietest slot near it
function anotherSheet() {
  let chosen = state.slot;
  openSheet(`<h2>Pick another time</h2>
    <p>Scroll to the time you'd rather go. We'll check the quietest slot near it.</p>
    <div class="wheel" style="margin-top:8px"><div class="band"></div>
      <div class="col" id="sheetHours" tabindex="0" aria-label="Hour"></div><div class="colon">:</div>
      <div class="col" id="sheetMins" tabindex="0" aria-label="Minutes"></div></div>
    <div style="height:14px"></div><button class="btn hand" id="checkTime">Check this time</button>`);
  buildWheel(sheet.querySelector("#sheetHours"), sheet.querySelector("#sheetMins"), chosen, s => { chosen = s; });
  sheet.querySelector("#checkTime").onclick = () => {
    state.slot = chosen; state.showDay = false; closeSheet(); render();
    toast(`Checked ${slotToTime(chosen)}. Here's the quietest time near it.`);
  };
}

function logSheet() {
  let count = 5;
  const opts = []; for (let s = FIRST; s <= LAST; s++) opts.push(`<option value="${s}"${s === state.slot ? " selected" : ""}>${slotToTime(s)}</option>`);
  openSheet(`<h2>Log the crowd</h2>
    <p>How many people were doing ${esc(state.split.toLowerCase())} when you were there?</p>
    <div class="chips" style="grid-template-columns:1fr 1fr;margin-top:16px">
      <button class="chip hand" data-when="today" aria-pressed="true">Today</button><button class="chip hand" data-when="yesterday" aria-pressed="false">Yesterday</button></div>
    <label class="field" for="logTime">Time <select id="logTime">${opts.join("")}</select></label>
    <div class="field">People there <div class="stepper"><button id="minus" aria-label="One fewer">−</button><output id="count">5</output><button id="plus" aria-label="One more">+</button></div></div>
    <div class="tallyline" id="tallyline">${tally(count, "var(--hi)")}</div>
    <button class="btn hand" id="logIt">Log it</button>`);
  const upd = () => { document.getElementById("count").textContent = count; document.getElementById("tallyline").innerHTML = tally(count, "var(--hi)"); };
  sheet.querySelector("#minus").onclick = () => { if (count > 0) { count--; upd(); } };
  sheet.querySelector("#plus").onclick = () => { if (count < 500) { count++; upd(); } };
  sheet.querySelectorAll("[data-when]").forEach(b => b.onclick = () => sheet.querySelectorAll("[data-when]").forEach(x => x.setAttribute("aria-pressed", String(x === b))));
  sheet.querySelector("#logIt").onclick = () => {
    const t = slotToTime(+document.getElementById("logTime").value);
    closeSheet(); toast(`Demo: ${count} people at ${t} wasn't saved. In the full app this feeds the next retrain.`);
  };
}
sheet.addEventListener("click", e => { if (e.target.closest("[data-close]")) closeSheet(); });

// ---------------------------------------------------------------- taps
board.addEventListener("click", e => {
  const el = e.target.closest("button"); if (!el) return;
  if (el.id === "themeBtn") {
    state.theme = { auto: "light", light: "dark", dark: "auto" }[state.theme];
    store.set("ff-theme", state.theme);
    applyTheme(); el.outerHTML = themeSwitch(); return;
  }
  if (el.dataset.split) { state.split = el.dataset.split; board.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", String(c === el))); return; }
  if (el.id === "next") { state.step = 2; state.dayIndex = 0; state.showDay = false; render(); window.scrollTo(0, 0); return; }
  if (el.id === "back") { state.step = 1; render(); return; }
  if (el.dataset.day) { state.dayIndex = +el.dataset.day; render(); return; }
  if (el.id === "going" || el.id === "keep") {
    const s = el.id === "going" ? state.rec.best : state.rec.pref;
    toast(`See you at ${slotToTime(s.slot)} ${dayWord(days[state.dayIndex], state.dayIndex)}. (Demo, so this wasn't saved.)`); return;
  }
  if (el.id === "another") { anotherSheet(); return; }
  if (el.id === "wholeDay") { state.showDay = !state.showDay; render(); return; }
  if (el.id === "howBtn") { howSheet(); return; }
  if (el.id === "logBtn") { logSheet(); return; }
});

render();
</script>

</body>
</html>
